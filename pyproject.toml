[tool.poetry]
name = "google-meeting-backend"
version = "0.1.0"
description = "Python selenium backend for google meeting automation"
authors = ["CueCard Dev <support@cuecard.ai>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
selenium = "^4.23.1"
pillow = "^10.4.0"
webdriver-manager = "^4.0.2"
highlight-io = "^0.10.0"
pydantic-settings = "^2.7.1"
fastapi = "^0.123.0"
uvicorn = "^0.38.0"
sqlalchemy = "^2.0.44"
apscheduler = "^3.11.1"
numpy = "<2.0.0"
sounddevice = "^0.5.3"
soundfile = "^0.13.1"
deepgram-sdk = "^5.3.0"
groq = "^0.37.0"
requests = "^2.32.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"