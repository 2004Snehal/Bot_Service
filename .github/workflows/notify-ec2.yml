name: Build and Notify EC2

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/hicappyai/voice:bot
            ghcr.io/hicappyai/voice:${{ github.sha }}
          build-args: |
            ENABLE_VOICE=true

      - name: Trigger EC2 webhook (if configured)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.EC2_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.EC2_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
          else
            echo "No webhook URL configured - EC2 will auto-pull via cron"
          fi
