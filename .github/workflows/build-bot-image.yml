name: Build and Push Bot Image

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/hicappyai/voice:bot
            ghcr.io/hicappyai/voice:${{ github.sha }}
          build-args: |
            ENABLE_VOICE=true

      - name: Build summary
        run: |
          echo "✅ Docker image built and pushed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "Image: ghcr.io/hicappyai/voice:bot" >> $GITHUB_STEP_SUMMARY
          echo "SHA: ghcr.io/hicappyai/voice:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To deploy on EC2, run:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/hicappyai/voice:bot" >> $GITHUB_STEP_SUMMARY
          echo "docker stop voice-bot && docker rm voice-bot" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d --name voice-bot --restart unless-stopped ghcr.io/hicappyai/voice:bot" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
