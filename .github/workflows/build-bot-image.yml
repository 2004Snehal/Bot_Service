name: Build and Deploy Bot to EC2

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Build Docker image (can fail without blocking deployment)
  build-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/hicappyai/voice:bot
            ghcr.io/hicappyai/voice:${{ github.sha }}
          build-args: |
            ENABLE_VOICE=true

  # Job 2: Deploy code to EC2 (always runs)
  deploy-code:
    runs-on: ubuntu-latest
    needs: build-docker
    if: always()
    
    steps:
      - name: Deploy code changes to EC2
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: false
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/bot_service || cd ~/bot_service || cd ~/Bot_Service
            git pull origin main
            
            # Try to restart service if it exists
            if command -v systemctl &> /dev/null; then
              sudo systemctl restart bot.service || true
            fi
            
            # Try Docker deployment if Docker is available
            if command -v docker &> /dev/null; then
              docker pull ghcr.io/hicappyai/voice:bot || true
              docker stop voice-bot || true
              docker rm voice-bot || true
              docker run -d --name voice-bot --restart unless-stopped ghcr.io/hicappyai/voice:bot || true
            fi
